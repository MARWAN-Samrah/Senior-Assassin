    const reason = entry.reason === 'host' ? 'Ended by host'
      : entry.reason === 'abandoned' ? 'Returned to setup'
        : entry.reason === 'last' ? 'Last one standing'
          : '';
    const kills = entry.eliminations || [];
    return `<article class="history-round">
      <div class="history-head">
        <div>
          <div class="history-title">Round ${esc(entry.round)}</div>
          <span class="history-meta">${entry.startedAt ? `Started ${esc(fmtDateTime(entry.startedAt))}` : 'Start time not recorded'}${entry.endedAt ? ` · Ended ${esc(fmtDateTime(entry.endedAt))}` : ''}${reason ? ` · ${esc(reason)}` : ''}</span>
        </div>
        ${entry.winnerName
          ? `<span class="pill pill-warn">★ ${esc(entry.winnerName)}</span>`
          : '<span class="pill pill-out">No winner</span>'}
      </div>
      ${kills.length
        ? `<ul class="history-kills">${kills.map((kill) => `<li><span>${esc(kill.text)}</span><time>${kill.t ? esc(fmtClock(kill.t)) : ''}</time></li>`).join('')}</ul>`
        : '<p class="hint">No eliminations recorded.</p>'}
    </article>`;
  }).join('')}</div>`;
}

function historyCardMarkup(s = state) {
  const count = (s.history || []).length;
  return `<details class="card details-card">
    <summary>Game history ${count ? `<span class="pill pill-mono">${count}</span>` : ''}</summary>
    <div class="details-body">${historyMarkup(s)}</div>
  </details>`;
}

/* =========================================================
   12. Landing and host unlock
   ========================================================= */
function viewLanding() {
  const ps = state.players;
  const me = ui.me ? byId(ui.me) : null;
  const registered = ps.filter((p) => p.pin).length;
  const alive = alivePlayers().length;
  const winner = gameWinner();

  let strip = '';
  if (ps.length) {
    const detail = state.phase === 'setup'
      ? `${ps.length} player${ps.length === 1 ? '' : 's'} · ${registered} registered`
      : state.phase === 'over'
        ? (winner ? `Winner: ${esc(winner.name)}` : 'Round complete')
        : `Round ${state.round || 1} · ${alive} alive of ${ps.length}${state.startedAt ? ` · ${roundClockText()}` : ''}`;
    strip = `<div class="strip">
      <span class="dot ${state.phase === 'setup' ? 'dot-waiting' : state.phase === 'over' ? 'dot-out' : 'dot-alive'}"></span>
      <span>A game is saved on this device</span>
      <span class="tab-spacer"></span>
      <b>${detail}</b>
    </div>`;
  }

  $('#view').innerHTML = `
    ${HAS_CRYPTO ? '' : `<div class="callout callout-danger">This browser does not expose Web Crypto. Open the file directly or serve it over <b>https://</b> or <b>localhost</b>; otherwise PINs cannot be hashed.</div>`}
    ${strip}
    <div class="choice-grid">
      <button type="button" class="card choice" data-go="host">
        <div class="choice-kicker">Restricted</div>
        <div class="choice-title">Host</div>
        <p class="choice-text">Run the roster, start the round, and manage PIN resets. Requires the master key.</p>
      </button>
      <button type="button" class="card choice" data-go="player">
        <div class="choice-kicker open">Open</div>
        <div class="choice-title">Player</div>
        <p class="choice-text">Register, reveal your target, and report an elimination. Your PIN keeps it private.</p>
      </button>
    </div>
    ${me ? `<button type="button" class="btn btn-ghost btn-block" data-go="continue" style="margin-top:14px">Continue as ${esc(me.name)}</button>` : ''}
    <p class="note">Game data is shared through Supabase in real time. Clearing one device does not erase the shared game.</p>`;
}

function viewHostKey() {
  const left = guard('host');
  $('#view').innerHTML = `
    <section class="card">
      <h2>Host access</h2>
      <p class="muted">Enter the master key to manage the player pool and generate assignments.</p>
      <form data-form="hostkey" autocomplete="off">
        <label class="label" for="hostKey">Master key</label>
        <div class="input-group">
          <input id="hostKey" class="input" type="password" maxlength="200" autocomplete="off"
            autocapitalize="off" spellcheck="false" placeholder="Master key">
          <button type="button" class="btn btn-ghost" data-act="toggle-pin" data-target="hostKey">Show</button>
        </div>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:14px" ${left ? 'disabled' : ''}>Unlock</button>
        <p class="err" id="hostErr" role="alert">${left ? `Locked. Try again in ${fmtSecs(left)}.` : ''}</p>
      </form>
      <button type="button" class="link" data-go="landing" style="margin-top:8px">← Back</button>
    </section>`;
  const field = $('#hostKey');
  if (field) field.focus();
}

/* =========================================================
   13. Host: player pool
   ========================================================= */
function viewRoster() {
  if (!isHost()) {
    logout();
    return;
  }
  const ps = state.players;
  const setup = state.phase === 'setup';
  const playing = state.phase === 'playing';
  const over = state.phase === 'over';
  const unreg = ps.filter((p) => !p.pin).length;
  const registered = ps.length - unreg;
  const alive = alivePlayers().length;
  const out = ps.filter((p) => p.status === 'out').length;
  const waiting = ps.filter((p) => p.status === 'waiting').length;
  const winner = gameWinner();
  const canGen = setup && ps.length >= MIN_PLAYERS && unreg === 0 && HAS_CRYPTO;
  const canNewRound = over && ps.length >= MIN_PLAYERS && ps.every((p) => p.pin) && HAS_CRYPTO;
  const lastUndo = ui.undo[ui.undo.length - 1];
  const me = ui.me ? byId(ui.me) : null;

  const addCard = over ? '' : `
    <section class="card">
      <div class="card-head">
        <h2>${setup ? 'Build the player pool' : 'Add a player'}</h2>
        <span class="pill pill-mono">${ps.length}/${MAX_PLAYERS}</span>
      </div>
      <p class="muted">${setup
        ? `Add at least ${MIN_PLAYERS} names. Everyone must register a PIN on the Join tab before you generate assignments.`
        : 'New players get a one-time registration code, then you can add them at a random point in the chain.'}</p>
      <form data-form="add" autocomplete="off">
        <div class="row-start">
          <label class="sr-only" for="nameIn">Player name</label>
          <input id="nameIn" class="input" maxlength="${MAX_NAME}" placeholder="Player name"
            autocomplete="off" autocapitalize="words" spellcheck="false">
          <button class="btn btn-primary" type="submit">Add</button>
        </div>
      </form>
      <details class="disclosure">
        <summary>Paste a list instead</summary>
        <div class="disclosure-body">
          <form data-form="bulk">
            <label class="sr-only" for="bulkNames">Names, one per line</label>
            <textarea id="bulkNames" class="input" rows="5" placeholder="Alex Kim&#10;Jordan Lee&#10;Sam Patel"></textarea>
            <button class="btn btn-ghost btn-sm" type="submit" style="margin-top:8px">Add all</button>
          </form>
        </div>
      </details>
    </section>`;

  const rows = ps.map((p) => {
    const isOut = p.status === 'out';
    const isWaiting = p.status === 'waiting';
    const actions = [
      `<button type="button" class="mini" data-act="rename" data-id="${p.id}">Rename</button>`,
      (!over && p.pin && !isOut) ? `<button type="button" class="mini" data-act="resetpin" data-id="${p.id}">Reset PIN</button>` : '',
      (playing && isWaiting && p.pin) ? `<button type="button" class="mini" data-act="join" data-id="${p.id}">Add to game</button>` : '',
      !isOut && !over ? `<button type="button" class="mini mini-danger" data-act="remove" data-id="${p.id}">Remove</button>` : ''
    ].join('');
    return `<li class="player-row ${p.status}">
      <div class="player-top">
        <span class="player-name">${esc(p.name)}${me && me.id === p.id ? '<span class="you">you</span>' : ''}</span>
        ${statusPill(p.status)}
        <span class="pill ${p.pin ? 'pill-ok' : 'pill-warn'}">${p.pin ? 'PIN set' : 'No PIN'}</span>
        ${setup ? '' : `<span class="pill pill-mono" title="Eliminations">☠ ${p.kills || 0}</span>`}
      </div>
      <div class="actions">${actions}</div>
    </li>`;
  }).join('');

  const generationCard = `
    <section class="card">
      <div class="card-head">
        <h2>${over ? 'Round complete' : setup ? 'Start the round' : 'Round in progress'}</h2>
        <span class="pill pill-mono">${setup ? 'Setup' : `Round ${state.round || 1}`}</span>
      </div>
      ${setup ? `
        <p class="muted">Assignments use the browser's secure random generator, then the app verifies that the result is one single chain.</p>
        <div class="stats">
          ${statMarkup(ps.length, 'players')}
          ${statMarkup(registered, 'registered')}
          ${statMarkup(unreg, 'to go')}
        </div>
        <div class="callout ${unreg || ps.length < MIN_PLAYERS ? 'callout-warn' : 'callout-ok'}">
          ${ps.length < MIN_PLAYERS
            ? `Add at least ${MIN_PLAYERS} players so nobody is forced into a mutual target.`
            : unreg
              ? `${unreg} player${unreg === 1 ? '' : 's'} still need a PIN. Exit the host console, then use Player → Join.`
              : 'Everyone is registered. The app never displays the full chain on screen.'}
        </div>
        <div class="field">${roundStartField(Date.now())}</div>
        <button type="button" class="btn btn-primary btn-block" data-act="generate" style="margin-top:14px" ${canGen ? '' : 'disabled'}>Generate assignments</button>
        <p class="hint">Once generated, the roster locks and each player can reveal only their own target with their PIN.</p>`
      : over ? `
        ${winner
          ? `<div class="winner"><div class="winner-kicker">Round winner</div><div class="winner-name">${esc(winner.name)}</div></div>`
          : '<p class="muted">No winner is recorded for this round. You can restart with the same roster.</p>'}
        ${roundClockMarkup(state)}
        <div class="field">${roundStartField(Date.now(), 'Next round start date & time')}</div>
        <div class="row" style="margin-top:16px">
          <button type="button" class="btn btn-primary" data-act="newround" ${canNewRound ? '' : 'disabled'}>New round</button>
          <button type="button" class="btn btn-ghost" data-act="backsetup">Edit roster</button>
        </div>
        <p class="hint">${canNewRound
          ? 'A new round reshuffles the same registered players and keeps their PINs.'
          : `All ${MIN_PLAYERS}+ players need a PIN before a new round can start.`}</p>`
      : `
        <p class="muted">Round ${state.round || 1} · started ${state.startedAt ? fmtAgoLong(state.startedAt) : 'recently'}.</p>
        <div class="stats">
          ${statMarkup(alive, 'alive')}
          ${statMarkup(out, 'out')}
          ${statMarkup(waiting, 'waiting')}
        </div>
        ${roundClockMarkup(state)}
        <div class="callout">New players added mid-round get a code. Once they register, use <b>Add to game</b> on their row to insert them at a random point in the chain.</div>`}
    </section>`;

  const roundControlCard = playing ? `
    <section class="card">
      <div class="card-head">
        <h2>Round controls</h2>
        <span class="pill pill-mono">Round ${state.round || 1}</span>
      </div>
      <p class="muted">Set the exact date and time the round began. The deadline is always calculated as 14 days later.</p>
      <form data-form="roundclock">
        <div class="field">${roundStartField(state.startedAt)}</div>
        <button class="btn btn-ghost btn-sm" type="submit" style="margin-top:10px">Update start time</button>
        <p class="err" id="roundClockErr" role="alert"></p>
      </form>
      <div class="row" style="margin-top:16px">
        <button type="button" class="btn btn-danger" data-act="endround">End round</button>
        <button type="button" class="btn btn-ghost" data-act="reset">Reset everything</button>
      </div>
      <p class="hint">Ending early records the current leader as the winner. A tie ends the round without a winner.</p>
    </section>` : '';

  $('#view').innerHTML = `
    <div class="stack">
      ${addCard}
      <section class="card">
        <div class="card-head">
          <h3>Player pool <span class="muted" style="font-weight:400">(${ps.length})</span></h3>
          ${setup && ps.length ? '<button type="button" class="link" data-act="clear">Clear all</button>' : ''}
        </div>
        ${ps.length ? `<ul class="list">${rows}</ul>` : '<p class="empty">No players yet. Add the first name above.</p>'}
      </section>
      ${generationCard}
      ${roundControlCard}
      ${historyCardMarkup(state)}
      <details class="card details-card">
        <summary>Backup &amp; advanced</summary>
        <div class="details-body">
          <div class="row">
            <button type="button" class="btn btn-ghost btn-sm" data-act="export">Download backup</button>
            <label class="btn btn-ghost btn-sm file-btn">Restore backup
              <input type="file" id="importFile" accept=".json,application/json">
            </label>
            ${lastUndo ? `<button type="button" class="btn btn-ghost btn-sm" data-act="undo">Undo: ${esc(lastUndo.label)}</button>` : ''}
            <button type="button" class="btn btn-ghost btn-sm" data-act="unlockall">Clear lockouts</button>
            <button type="button" class="btn btn-danger btn-sm" data-act="reset">Reset everything</button>
          </div>
          <p class="hint">A backup contains PIN hashes, players, history and the round clock. Keep it private. Restoring replaces the current game on this device.</p>
          <p class="hint">Version ${APP_VERSION} · state is shared through Supabase</p>
        </div>
      </details>
    </div>`;
}

/* =========================================================
   14. Shared status view
   ========================================================= */
function viewStatus() {
  const host = isHost();
  const ps = state.players;
  const alive = alivePlayers().length;
  const out = ps.filter((p) => p.status === 'out').length;
  const waiting = ps.filter((p) => p.status === 'waiting').length;
  const registered = ps.filter((p) => p.pin).length;
  const setup = state.phase === 'setup';
  const me = ui.me ? byId(ui.me) : null;
  const winner = gameWinner();
  const wins = winCounts();
  const healthy = chainOk();
  const sorted = ps.slice().sort((a, b) => (b.kills || 0) - (a.kills || 0) || a.name.localeCompare(b.name));

  let meNote = '';
  if (!host && me) {
    if (!me.pin) {
      meNote = `<div class="you-note">You have not registered a PIN yet. <button type="button" class="link" data-act="goto" data-tab="join">Register now</button></div>`;
    } else if (state.phase === 'over') {
      meNote = `<div class="you-note">This round is over. ${winner && winner.id === me.id ? 'You won this round.' : 'Wait for the host to start the next round.'}</div>`;
    } else if (me.status === 'waiting') {
      meNote = `<div class="you-note">You are registered. ${state.phase === 'playing' ? 'The host still needs to add you to the chain.' : 'The round has not started yet.'}</div>`;
    } else if (me.status === 'out') {
      meNote = `<div class="you-note">You are out of this round. You can still watch the kill feed.</div>`;
    } else {
      meNote = `<div class="you-note">You are alive. Open <b>My target</b> and enter your PIN to see who you are hunting.</div>`;
    }
  }

  const rows = sorted.length ? sorted.map((p) => `
    <li class="player-row ${p.status}">
      <div class="player-top">
        <span class="player-name">${esc(p.name)}${me && me.id === p.id ? '<span class="you">you</span>' : ''}</span>
        ${statusPill(p.status)}
        ${host ? `<span class="pill ${p.pin ? 'pill-ok' : 'pill-warn'}">${p.pin ? 'PIN set' : 'No PIN'}</span>` : ''}
        <span class="pill ${wins.get(p.id) ? 'pill-warn' : 'pill-mono'}" title="Rounds won">★ ${winLabel(wins.get(p.id) || 0)}</span>
        ${setup ? '' : `<span class="pill pill-mono" title="Eliminations">☠ ${p.kills || 0}</span>`}
      </div>
    </li>`).join('') : '';

  $('#view').innerHTML = `
    <div class="stack">
      <section class="card">
        <div class="card-head">
          <h2>${state.phase === 'over' ? 'Game over' : setup ? 'Waiting to start' : 'Game in progress'}</h2>
          ${setup ? '' : `<span class="pill ${healthy ? 'pill-ok' : 'pill-blood'}">${healthy ? '✓ Chain verified' : '⚠ Chain error'}</span>`}
        </div>
        <p class="muted">${setup
          ? 'The host builds the pool. Everyone registers a PIN before assignments are generated.'
          : `Round ${state.round || 1}${state.startedAt ? ` · started ${fmtAgoLong(state.startedAt)}` : ''}`}</p>
        ${roundClockMarkup(state)}
        <div class="stats">
          ${setup
            ? statMarkup(ps.length, 'players') + statMarkup(registered, 'registered') + statMarkup(ps.length - registered, 'to go')
            : statMarkup(alive, 'alive') + statMarkup(out, 'eliminated') + statMarkup(ps.length, 'players')}
        </div>
        ${state.phase !== 'setup' && !healthy ? '<div class="callout callout-danger">The player chain failed its integrity check. Restore a backup or reset the game from the host console.</div>' : ''}
        ${winner ? `<div class="winner"><div class="winner-kicker">Round winner</div><div class="winner-name">${esc(winner.name)}</div></div>` : ''}
        ${meNote}
      </section>

      <section class="card">
        <div class="card-head"><h3>Players</h3><span class="pill pill-mono">${ps.length}</span></div>
        ${rows ? `<ul class="list">${rows}</ul>` : '<p class="empty">No players yet.</p>'}
      </section>

      <section class="card">
        <div class="card-head"><h3>Kill feed</h3></div>
        ${feedMarkup(state.log, 'No eliminations yet.')}
      </section>

      ${historyCardMarkup(state)}

      ${host ? `
        <details class="card details-card">
          <summary>Host activity log</summary>
          <div class="details-body">${auditMarkup(state.audit)}</div>
        </details>` : ''}
    </div>`;
}

/* =========================================================
   15. Player: join / register
   ========================================================= */
function optionMarkup(list, selected, placeholder) {
  return (placeholder ? `<option value="">${esc(placeholder)}</option>` : '')
    + list.map((p) => `<option value="${p.id}" ${String(p.id) === String(selected) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
}

function joinFieldsMarkup(player) {
  if (!player) return '<p class="hint">Select your name to continue.</p>';
  return `
    ${player.tempCode ? `
      <label class="label" for="joinCode">Registration code from the host</label>
      <input id="joinCode" class="input code-input" maxlength="9" autocomplete="off"
        autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" data-code>` : ''}
    <label class="label" for="joinPin">Choose a PIN (${MIN_PIN}–${MAX_PIN} digits)</label>
    <input id="joinPin" class="input pin-input" type="password" inputmode="numeric" maxlength="${MAX_PIN}"
      autocomplete="off" placeholder="••••" data-pin>
    <label class="label" for="joinPin2">Confirm PIN</label>
    <input id="joinPin2" class="input pin-input" type="password" inputmode="numeric" maxlength="${MAX_PIN}"
      autocomplete="off" placeholder="••••" data-pin>
    <p class="hint">Register only your own name. The PIN cannot be recovered; the host can issue a reset code.</p>`;
}

function viewJoin() {
  const list = joinablePlayers();
  if (!list.length) {
    ui.tab = null;
    render();
    return;
  }
  const selected = list.find((p) => String(p.id) === String(ui.selJoin))
    || list.find((p) => p.id === ui.me)
    || null;
  ui.selJoin = selected ? String(selected.id) : '';

  $('#view').innerHTML = `
    <section class="card">
      <h2>Join the game</h2>
      <p class="muted">Pick your own name and choose a private PIN. You will need it to reveal your target and report eliminations.</p>
      <form data-form="join" autocomplete="off">
        <label class="label" for="joinWho">Your name</label>
        <select id="joinWho" class="input">${optionMarkup(list, ui.selJoin, 'Select name…')}</select>
        <div id="joinFields">${joinFieldsMarkup(selected)}</div>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">Register</button>
        <p class="err" id="joinErr" role="alert"></p>
      </form>
    </section>`;

  const first = selected && selected.tempCode ? $('#joinCode') : $('#joinPin');
  if (first) first.focus();
}

function refreshJoinFields() {
  const list = joinablePlayers();
  const player = list.find((p) => String(p.id) === String(ui.selJoin)) || null;
  const box = $('#joinFields');
  if (box) box.innerHTML = joinFieldsMarkup(player);
  const err = $('#joinErr');
  if (err) err.textContent = '';
  if (player) {
    const first = player.tempCode ? $('#joinCode') : $('#joinPin');
    if (first) first.focus();
  }
}

/* =========================================================
   16. Player: reveal
   ========================================================= */
function viewReveal() {
  if (state.phase !== 'playing') {
    ui.tab = 'status';
    render();
    return;
  }
  const candidates = alivePlayers();
  if (!candidates.length) {
    $('#view').innerHTML = '<section class="card"><h2>My target</h2><p class="muted">There is nobody to reveal right now.</p></section>';
    return;
  }
  let selectedId = candidates.some((p) => String(p.id) === String(ui.selReveal)) ? Number(ui.selReveal) : 0;
  if (!selectedId && ui.me && candidates.some((p) => p.id === ui.me)) selectedId = ui.me;
  ui.selReveal = selectedId ? String(selectedId) : '';

  $('#view').innerHTML = `
    <section class="card">
      <h2>Reveal my target</h2>
      <p class="muted">Make sure nobody is looking. The name shows for ${REVEAL_SECS} seconds, then hides automatically.</p>
      ${roundClockInline(state)}
      <form data-form="reveal" autocomplete="off">
        <label class="label" for="revealWho">Your name</label>
        <select id="revealWho" class="input">${optionMarkup(candidates, ui.selReveal, 'Select name…')}</select>
        <label class="label" for="revealPin">Your PIN</label>
        <input id="revealPin" class="input pin-input" type="password" inputmode="numeric"
          maxlength="${MAX_PIN}" autocomplete="off" placeholder="••••" data-pin>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">Reveal</button>
        <p class="err" id="revealErr" role="alert"></p>
      </form>
      <div id="secret"></div>
      <p class="hint">Eliminated players cannot reveal a target. If your PIN was reset, use the Join tab with the host's code.</p>
    </section>`;

  if (selectedId) {
    const pin = $('#revealPin');
    if (pin) pin.focus();
  }
}

/* =========================================================
   17. Player: elimination
   ========================================================= */
function victimOptions(hunterId) {
  const list = alivePlayers().filter((p) => p.id !== Number(hunterId));
  return optionMarkup(list, ui.selVictim, 'Select player…');
}

function viewElim() {
  if (state.phase !== 'playing') {
    ui.tab = 'status';
    render();
    return;
  }
  const alive = alivePlayers();
  if (alive.length < 2) {
    $('#view').innerHTML = '<section class="card"><h2>Report an elimination</h2><p class="muted">There is no elimination to report right now.</p></section>';
    return;
  }

  let hunterId = alive.some((p) => String(p.id) === String(ui.selHunter)) ? Number(ui.selHunter) : 0;
  if (!hunterId && ui.me && alive.some((p) => p.id === ui.me)) hunterId = ui.me;
  ui.selHunter = hunterId ? String(hunterId) : '';
  const validVictim = alive.some((p) => String(p.id) === String(ui.selVictim) && p.id !== hunterId);
  ui.selVictim = validVictim ? String(ui.selVictim) : '';

  $('#view').innerHTML = `
    <section class="card">
      <h2>Report an elimination</h2>
      <p class="muted">The assassin enters their own PIN. A claim is accepted only if that player is actually hunting the selected target.</p>
      ${roundClockInline(state)}
      <form data-form="elim" autocomplete="off">
        <label class="label" for="elimHunter">Assassin (who made the elimination)</label>
        <select id="elimHunter" class="input">${optionMarkup(alive, ui.selHunter, 'Select name…')}</select>
        <label class="label" for="elimVictim">Eliminated player</label>
        <select id="elimVictim" class="input">${victimOptions(hunterId)}</select>
        <label class="label" for="elimPin">Assassin's PIN</label>
        <input id="elimPin" class="input pin-input" type="password" inputmode="numeric"
          maxlength="${MAX_PIN}" autocomplete="off" placeholder="••••" data-pin>
        <button class="btn btn-primary btn-block" type="submit" style="margin-top:16px">Confirm elimination</button>
        <p class="err" id="elimErr" role="alert"></p>
      </form>
      <div id="secret"></div>
      <p class="hint">After a confirmed elimination the assassin immediately inherits the eliminated player's target.</p>
    </section>`;

  if (hunterId) {
    const pin = $('#elimPin');
    if (pin) pin.focus();
  }
}

/* =========================================================
   18. Render pipeline and navigation
   ========================================================= */
function availableTabs() {
  if (isHost()) return [['roster', 'Players'], ['status', 'Status']];
  const tabs = [];
  if (joinablePlayers().length) tabs.push(['join', 'Join']);
  if (state.phase === 'playing') tabs.push(['reveal', 'My target'], ['elim', 'Elimination']);
  tabs.push(['status', 'Status']);
  return tabs;
}

function renderNav(tabs) {
  const nav = $('#tabs');
  if (!nav) return;
  nav.innerHTML = tabs.map(([key, label]) =>
    `<button type="button" class="tab" data-tab="${key}" aria-current="${ui.tab === key ? 'page' : 'false'}">${esc(label)}</button>`
  ).join('')
    + '<span class="tab-spacer"></span>'
    + `<button type="button" class="tab-exit" data-act="exit">${isHost() ? 'Lock console' : 'Exit'}</button>`;
}

function render() {
  const nav = $('#tabs');
  const view = $('#view');
  if (!nav || !view) return;
  try {
    cancelSecret();
    if (ui.stage !== 'app') {
      nav.hidden = true;
      nav.innerHTML = '';
      ui.focusSel = null;
      if (ui.stage === 'hostkey') viewHostKey();
      else viewLanding();
      return;
    }

    const tabs = availableTabs();
    if (!tabs.some(([key]) => key === ui.tab)) ui.tab = tabs[0][0];
    nav.hidden = false;
    renderNav(tabs);

    const views = {
      roster: viewRoster,
      status: viewStatus,
      join: viewJoin,
      reveal: viewReveal,
      elim: viewElim
    };
    const draw = views[ui.tab] || viewStatus;
    draw();

    if (ui.focusSel) {
      const target = $(ui.focusSel);
      ui.focusSel = null;
      if (target) target.focus({ preventScroll: true });
    } else if (ui.focusView) {
      ui.focusView = false;
      view.focus({ preventScroll: true });
    }
  } catch (error) {
    console.error(error);
    renderError(error);
  }
}

function renderError(error) {
  const nav = $('#tabs');
  if (nav) nav.hidden = true;
  const view = $('#view');
  if (!view) return;
  view.innerHTML = `
    <section class="card">
      <h2>Something went wrong</h2>
      <p class="muted">The screen could not be drawn. Your saved game has not been changed.</p>
      <div class="callout callout-danger">${esc(error && error.message ? error.message : error)}</div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn btn-primary" data-act="reload">Reload</button>
      </div>
    </section>`;
}

function selectTab(tab) {
  if (!tab) return;
  if (!availableTabs().some(([key]) => key === tab)) return;
  if (ui.tab === tab) return;
  cancelSecret();
  ui.tab = tab;
  ui.focusView = true;
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function logout(message) {
  closeModal();
  cancelSecret();
  ui.stage = 'landing';
  ui.role = null;
  ui.tab = null;
  ui.me = null;
  ui.selReveal = '';
  ui.selHunter = '';
  ui.selVictim = '';
  ui.selJoin = '';
  ui.undo = [];
  ui.idleWarned = false;
  clearSession();
  render();
  if (message) toast(message, 'info');
}

async function runBusy(button, label, work) {
  if (ui.busy) return;
  ui.busy = true;
  const previous = button ? button.innerHTML : '';
  if (button) {
    button.disabled = true;
    button.classList.add('is-busy');
    button.textContent = label;
  }
  try {
    await work();
  } catch (error) {
    console.error(error);
    toast(error && error.message ? error.message : 'Something went wrong.', 'error', 6000);
  } finally {
    ui.busy = false;
    if (button && button.isConnected) {
      button.classList.remove('is-busy');
      button.innerHTML = previous;
      button.disabled = button.dataset.lock === '1';
    }
  }
}

/* =========================================================
   19. Host actions
   ========================================================= */
async function handleHostKey(form) {
  const input = $('#hostKey', form) || $('#hostKey');
  const err = $('#hostErr');
  const value = input ? input.value.trim() : '';
  const left = guard('host');
  if (left) {
    if (err) err.textContent = `Too many attempts. Try again in ${fmtSecs(left)}.`;
    return;
  }
  if (!value) {
    if (err) err.textContent = 'Enter the master key.';
    if (input) input.focus();
    return;
  }
  if (!HAS_CRYPTO) {
    if (err) err.textContent = 'Web Crypto is unavailable. Serve the page over https:// or localhost.';
    return;
  }

  const button = form.querySelector('button[type="submit"]');
  await runBusy(button, 'Checking…', async () => {
    const hash = await kdf(value, HOST_SALT, HOST_ITER);
    if (HOST_HASHES.some((known) => eq(hash, known))) {
      await succeed('host');
      clearSession();
      ui.stage = 'app';
      ui.role = 'host';
      ui.tab = 'roster';
      ui.me = null;
      ui.lastActive = Date.now();
      ui.idleWarned = false;
      toast('Host console unlocked.', 'ok');
      render();
      return;
    }
    await fail('host');
    const locked = guard('host');
    if (input) {
      input.value = '';
      input.focus();
    }
    if (err) {
      err.textContent = locked
        ? `Wrong key. Locked for ${fmtSecs(locked)}.`
        : 'Wrong key.';
    }
  });
}

async function addPlayers(rawNames) {
  if (!isHost() || state.phase === 'over') return;
  const names = [];
  const dups = [];
  for (const raw of rawNames) {
    const name = cleanName(raw);
    if (!name) continue;
    const lower = name.toLowerCase();
    if (state.players.some((p) => p.name.toLowerCase() === lower)
      || names.some((n) => n.toLowerCase() === lower)) {
      if (!dups.includes(name)) dups.push(name);
      continue;
    }
    names.push(name);
  }
  if (!names.length) {
    toast(dups.length ? `Already in the pool: ${dups.join(', ')}` : 'Enter a name first.', 'warn');
    return;
  }
  const room = MAX_PLAYERS - state.players.length;
  if (room <= 0) {
    toast(`The pool is limited to ${MAX_PLAYERS} players.`, 'error');
    return;
  }
  const accepted = names.slice(0, room);
  if (accepted.length < names.length) toast(`Only the first ${accepted.length} names fit.`, 'warn');

  const prepared = [];
  try {
    for (const name of accepted) {
      let code = null;
      let temp = null;
      if (state.phase !== 'setup') {
        code = makeCode();
        temp = await codeCredential(code);
      }
      prepared.push({ name, code, temp });
    }
  } catch (error) {
    console.error(error);
    toast('Could not create registration codes.', 'error');
    return;
  }

  const change = await applyChange((s) => {
    for (const item of prepared) {
      s.players.push({
        id: s.nextId++,
        name: item.name,
        status: 'waiting',
        target: -1,
        kills: 0,
        pin: null,
        tempCode: item.temp,
        joinedAt: Date.now()
      });
      pushAudit(s, `Added ${item.name}`);
    }
    return true;
  }, { undoLabel: `${prepared.length} player${prepared.length === 1 ? '' : 's'} added` });

  if (!change.ok) {
    toast(change.error || 'Could not add players.', 'error');
    return;
  }

  const codes = prepared.filter((item) => item.code).map((item) => [item.name, item.code]);
  toast(
    `${prepared.length} player${prepared.length === 1 ? '' : 's'} added`
      + (dups.length ? ` · skipped ${dups.length} duplicate${dups.length === 1 ? '' : 's'}` : '') + '.',
    dups.length ? 'warn' : 'ok'
  );
  ui.focusSel = '#nameIn';
  render();
  if (codes.length) await showCodes(codes);
}

async function renamePlayer(player) {
  if (!isHost() || !player) return;
  const value = await promptDialog(`Rename ${player.name}`, 'Display name', {
    value: player.name,
    maxLength: MAX_NAME,
    okLabel: 'Save',
    validate: (input) => {
      const name = cleanName(input);
      if (!name) return 'Enter a name.';
      if (state.players.some((p) => p.id !== player.id && p.name.toLowerCase() === name.toLowerCase())) {
        return 'That name is already in the pool.';
      }
      return null;
    }
  });
  if (value === null) return;
  const name = cleanName(value);
  if (!name || name === player.name) return;

  const oldName = player.name;
  const change = await applyChange((s) => {
    const target = s.players.find((p) => p.id === player.id);
    if (!target) return false;
    target.name = name;
    pushAudit(s, `Renamed ${oldName} to ${name}`);
    return true;
  }, { undoLabel: `Rename ${oldName}` });
  if (!change.ok) {
    toast(change.error || 'Could not rename that player.', 'error');
    return;
  }
  toast('Name updated.', 'ok');
  render();
}

async function resetPlayerPin(player) {
  if (!isHost() || !player || state.phase === 'over') return;
  const ok = await confirmDialog(
    'Reset PIN',
    `Reset <b>${esc(player.name)}</b>'s PIN? ${state.phase === 'setup'
      ? 'They will be able to register a new one on the Join tab.'
      : 'You will get a one-time code to give them.'}`,
    { okLabel: 'Reset PIN', danger: true }
  );
  if (!ok) return;

  let code = null;
  let temp = null;
  if (state.phase !== 'setup') {
    try {
      code = makeCode();
      temp = await codeCredential(code);
    } catch (error) {
      console.error(error);
      toast('Could not create a registration code.', 'error');
      return;
    }
  }

  const change = await applyChange((s) => {
    const target = s.players.find((p) => p.id === player.id);
    if (!target) return false;
    target.pin = null;
    if (temp) target.tempCode = temp;
    else delete target.tempCode;
    delete s.locks['p' + target.id];
    delete s.locks['r' + target.id];
    pushAudit(s, `Reset PIN for ${target.name}${code ? ' (code issued)' : ''}`);
    return true;
  }, { undoLabel: `Reset PIN: ${player.name}` });
  if (!change.ok) {
    toast(change.error || 'Could not reset that PIN.', 'error');
    return;
  }
  render();
  if (code) await showCodes([[player.name, code]]);
  else toast(`${player.name} can register a new PIN on the Join tab.`, 'ok');
}

async function removePlayer(player) {
  if (!isHost() || !player) return;
  const isAlive = player.status === 'alive';
  if (isAlive) {
    const hunter = state.players.find((p) => p.status === 'alive' && p.target === player.id);
    if (!hunter) {
      toast('That player is not part of a valid chain, so they cannot be removed safely.', 'error');
      return;
    }
  }
  const ok = await confirmDialog(
    'Remove player',
    isAlive
      ? `Remove <b>${esc(player.name)}</b> from the game? Their hunter immediately inherits their target.`
      : `Remove <b>${esc(player.name)}</b> from the player pool?`,
    { okLabel: 'Remove', danger: true }
  );
  if (!ok) return;

  const change = await applyChange((s) => {
    if (!isAlive) {
      const index = s.players.findIndex((p) => p.id === player.id);
      if (index < 0) return false;
      const [gone] = s.players.splice(index, 1);
      pushAudit(s, `Removed ${gone.name} from the pool`);
      return true;
    }
    const X = s.players.find((p) => p.id === player.id);
    if (!X) return false;
    if (X.status !== 'alive') return false;
    const hunter = s.players.find((p) => p.status === 'alive' && p.target === X.id);
    if (!hunter) return false;
    hunter.target = X.target;
    X.status = 'out';
    X.target = -1;
    pushLog(s, `${X.name} was removed from the game`, 'host');
    pushAudit(s, `Removed ${X.name}; ${hunter.name} inherited their target`);
    if (alivePlayers(s).length <= 1) finishRound(s, 'last');
    return true;
  }, { undoLabel: `Remove ${player.name}` });

  if (!change.ok) {
    toast(change.error || 'Could not remove that player.', 'error');
    return;
  }
  toast('Player removed.', 'ok');
  render();
}

async function addToGame(player) {
  if (!isHost() || !player || state.phase !== 'playing') return;
  if (player.status !== 'waiting' || !player.pin) return;
  const ok = await confirmDialog(
    'Add to game',
    `Add <b>${esc(player.name)}</b> to the chain at a random position? They become alive immediately.`,
    { okLabel: 'Add to game' }
  );
  if (!ok) return;

  const change = await applyChange((s) => {
    const N = s.players.find((p) => p.id === player.id);
    if (!N || N.status !== 'waiting') return false;
    const living = s.players.filter((p) => p.status === 'alive');
    if (!living.length) return false;
    const A = living[secureInt(living.length)];
    N.target = A.target;
    A.target = N.id;
    N.status = 'alive';
    N.kills = 0;
    pushLog(s, `${N.name} joined the game`, 'join');
    pushAudit(s, `Added ${N.name} to the chain after ${A.name}`);
    return true;
  }, { undoLabel: `Add ${player.name} to game` });

  if (!change.ok) {
    toast(change.error || 'Could not add that player to the chain.', 'error');
    return;
  }
  toast(`${player.name} is in the game.`, 'ok');
  render();
}

async function startRound(isNewRound) {
  if (!isHost()) return;
  if (!HAS_CRYPTO) {
    toast('Web Crypto is unavailable, so assignments cannot be generated.', 'error');
    return;
  }
  if (isNewRound ? state.phase !== 'over' : state.phase !== 'setup') return;
  const players = state.players;
  if (players.length < MIN_PLAYERS) {
    toast(`Add at least ${MIN_PLAYERS} players first.`, 'warn');
    return;
  }
  if (players.some((p) => !p.pin)) {
    toast('Every player needs a registered PIN first.', 'warn');
    return;
  }

  const field = $('#roundStart');
  const startTs = field ? new Date(field.value).getTime() : Date.now();
  if (!Number.isFinite(startTs)) {
    toast('Enter a valid start date and time.', 'warn');
    return;
  }
  if (startTs > Date.now() + 60000) {
    toast('The start time cannot be in the future.', 'warn');
    return;
  }

  const roundNo = (state.round || 0) + 1;
  const ok = await confirmDialog(
    isNewRound ? 'Start a new round' : 'Generate assignments',
    `${isNewRound
      ? `Reshuffle the same <b>${players.length}</b> players and start round <b>${roundNo}</b>?`
      : `Generate assignments for <b>${players.length}</b> players? The pool locks and everyone becomes alive.`}
      <br><br>Starts <b>${esc(fmtDateTime(startTs))}</b><br>Ends <b>${esc(fmtDateTime(startTs + ROUND_MS))}</b>`,
    { okLabel: isNewRound ? 'Start round' : 'Generate' }
  );
  if (!ok) return;

  const order = shuffle(players.map((p) => p.id));
  const targetById = new Map(order.map((id, index) => [id, order[(index + 1) % order.length]]));
  const draft = players.map((p) => ({ ...p, status: 'alive', target: targetById.get(p.id), kills: 0 }));
  if (!verifyChain(draft, true)) {
    toast('Could not build a valid chain. Please try again.', 'error');
    return;
  }

  const change = await applyChange((s) => {
    if (s.phase === 'over') recordRoundHistory(s, 'archive');
    s.phase = 'playing';
    s.round = roundNo;
    s.startedAt = startTs;
    s.endedAt = 0;
    s.log = [];
    for (const p of s.players) {
      p.status = 'alive';
      p.target = targetById.get(p.id);
      p.kills = 0;
    }
    pushLog(s, `Round ${roundNo} began`, 'round');
    pushAudit(s, `Round ${roundNo} started with ${s.players.length} players`);
    return true;
  }, { undoLabel: `Start round ${roundNo}` });

  if (!change.ok) {
    toast(change.error || 'Could not start the round.', 'error');
    return;
  }
  ui.selReveal = '';
  ui.selHunter = '';
  ui.selVictim = '';
  ui.tab = 'status';
  toast(`Round ${roundNo} started. Targets are secret.`, 'ok');
  render();
}

async function saveRoundStart(form) {
  if (!isHost() || state.phase !== 'playing') return;
  const err = $('#roundClockErr', form) || $('#roundClockErr');
  const field = $('#roundStart', form) || $('#roundStart');
  const ts = field ? new Date(field.value).getTime() : NaN;
  if (!Number.isFinite(ts)) {
    if (err) err.textContent = 'Enter a valid start date and time.';
    return;
  }
  if (ts > Date.now() + 60000) {
    if (err) err.textContent = 'The start time cannot be in the future.';
    return;
  }
  if (Math.abs(ts - state.startedAt) < 1000) {
    if (err) err.textContent = 'That is already the recorded start time.';
    return;
  }
  if (err) err.textContent = '';
  const change = await applyChange((s) => {
    s.startedAt = ts;
    pushAudit(s, `Round ${s.round} start set to ${new Date(ts).toLocaleString()}`);
    return true;
  }, { undoLabel: 'Update round start' });
  if (!change.ok) {
    if (err) err.textContent = change.error || 'Could not save the start time.';
    return;
  }
  toast(`Start time saved. The round ends ${fmtDateTime(ts + ROUND_MS)}.`, 'ok');
  render();
}

async function endRound() {

      : `No unique leader is alive, so round <b>${state.round || 1}</b> will end without a winner.<br><br>Eliminations are still archived in the game history.`,
    { okLabel: 'End round', danger: true }

  if (!ok) return;

}

async function clearPool() {

async function importBackup(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('That file is too large to be a backup.', 'error');
    return;
  }
  let text = '';
  try {
    text = await file.text();
  } catch (error) {
    console.error(error);
    toast('Could not read that file.', 'error');
    return;
  }
  let parsed = null;
  try { parsed = JSON.parse(text); } catch { parsed = null; }
  const next = normalizeState(parsed);
  if (!next) {
    toast('That is not a valid Senior Assassin backup.', 'error');
    return;
  }
  const seen = new Set();
  for (const player of next.players) {
    const key = player.name.toLowerCase();
    if (seen.has(key)) {
      toast('The backup contains duplicate player names.', 'error');
      return;
    }
    seen.add(key);
  }
  if (next.phase === 'playing' && alivePlayers(next).length >= 2 && !verifyChain(alivePlayers(next), false)) {
    toast('The backup has a broken target chain and was not restored.', 'error');
    return;
  }
  if (next.phase === 'playing' && alivePlayers(next).length <= 1 && next.players.length > 1) {
    next.phase = 'over';
    next.endedAt = next.endedAt || Date.now();
    recordRoundHistory(next, 'import');
  }

  const ok = await confirmDialog(
    'Restore backup',
    `Replace the current game with this backup?<br><br><b>${next.players.length}</b> player${next.players.length === 1 ? '' : 's'} · ${esc(PHASE_LABEL[next.phase])}${next.round ? ` · round ${next.round}` : ''}`,
    { okLabel: 'Restore', danger: true }
  );
  if (!ok) return;

  next.locks = JSON.parse(JSON.stringify(state.locks || {}));
  await replaceState(next);
  ui.undo = [];
  ui.me = null;
  ui.selReveal = '';
  ui.selHunter = '';
  ui.selVictim = '';
  ui.selJoin = '';
  ui.tab = 'roster';
  clearSession();
  toast('Backup restored.', 'ok');
  render();
}

async function handleUndo() {
  const entry = ui.undo[ui.undo.length - 1];
  if (!entry) return;
  const ok = await confirmDialog(
    'Undo last change',
    `Undo <b>${esc(entry.label)}</b>? The game will return to how it was just before that action.`,
    { okLabel: 'Undo' }
  );
  if (ok) await undoLast();
}

async function clearLockouts() {
  if (!isHost()) return;
  const active = Object.values(state.locks).filter((lock) => lock && (lock.until > Date.now() || lock.n > 0));
  if (!active.length) {
    toast('There are no active lockouts.', 'info');
    return;
  }
  const ok = await confirmDialog(
    'Clear lockouts',
    'Reset every PIN and host-key attempt counter? This only removes wait times; it does not change players, PINs or targets.',
    { okLabel: 'Clear lockouts' }
  );
  if (!ok) return;
  const change = await applyChange((s) => {
    s.locks = {};
    return true;
  }, { undoLabel: 'Clear lockouts' });
  if (!change.ok) {
    toast(change.error || 'Could not clear lockouts.', 'error');
    return;
  }
  toast('Lockouts cleared.', 'ok');
  render();
}

/* =========================================================
   20. Player actions
   ========================================================= */
function formButton(form) {
  return form ? form.querySelector('button[type="submit"]') : null;
}

function clearPinFields(form) {
  if (!form) return;
  for (const field of $$('[data-pin]', form)) field.value = '';
}

async function handleJoin(form) {
  const err = $('#joinErr');
  const player = byId(ui.selJoin);
  if (!player) {
    if (err) err.textContent = 'Select your name first.';
    return;
  }
  if (state.phase === 'over') {
    if (err) err.textContent = 'This round is over. Wait for the host to start a new one.';
    return;
  }

  const codeField = $('#joinCode', form);
  const pins = $$('[data-pin]', form);
  const pin = pins[0] ? pins[0].value.trim() : '';
  const confirm = pins[1] ? pins[1].value.trim() : '';
  if (err) err.textContent = '';

  await runBusy(formButton(form), 'Registering…', async () => {
    const result = await registerPin(player, pin, confirm, codeField ? codeField.value : '');
    if (!result.ok) {
      if (err) err.textContent = result.err;
      clearPinFields(form);
      const firstPin = $('#joinPin', form);
      if (firstPin) firstPin.focus();
      return;
    }

    ui.stage = 'app';
    ui.role = 'player';
    ui.me = result.player.id;
    saveSession();
    ui.selJoin = '';
    ui.tab = defaultPlayerTab();
    ui.focusView = true;
    toast('PIN registered. Keep it private.', 'ok');
    render();
  });
}

async function handleReveal(form) {
  const err = $('#revealErr');
  const player = byId(ui.selReveal);
  if (!player) {
    if (err) err.textContent = 'Select your name first.';
    return;
  }
  if (state.phase !== 'playing') {
    if (err) err.textContent = 'The round is not running.';
    return;
  }
  if (player.status !== 'alive') {
    if (err) err.textContent = 'Only players still in the game can reveal a target.';
    return;
  }

  const pinField = $('#revealPin', form);
  const pin = pinField ? pinField.value.trim() : '';
  if (err) err.textContent = '';
  const button = formButton(form);

  await runBusy(button, 'Checking…', async () => {
    const result = await checkPin(player, pin);
    if (!result.ok) {
      if (err) err.textContent = result.err;
      if (pinField) {
        pinField.value = '';
        pinField.focus();
      }
      return;
    }

    const me = result.player;
    const target = byId(me.target);
    if (!target || me.status !== 'alive' || state.phase !== 'playing') {
      if (err) err.textContent = 'Your assignment is unavailable. Ask the host to check the game.';
      return;
    }

    ui.me = me.id;
    ui.selReveal = String(me.id);
    saveSession();
    if (pinField) pinField.value = '';
    if (err) err.textContent = '';
    if (button) button.dataset.lock = '1';

    startSecret(`
      <div class="secret-kicker">Your target</div>
      <div class="secret-name">${esc(target.name)}</div>
      <p class="secret-sub">This hides automatically. Do not let anyone else see it.</p>`,
    REVEAL_SECS, () => {
      if (button && button.isConnected) {
        delete button.dataset.lock;
        button.disabled = false;
      }
      const again = $('#revealPin');
      if (again) again.focus();
      toast('Target hidden.', 'info', 2200);
      flushPendingSync();
    });
  });
}

async function handleElim(form) {
  const err = $('#elimErr');
  const hunter = byId(ui.selHunter);
  const victim = byId(ui.selVictim);
  if (!hunter) {
    if (err) err.textContent = 'Select the assassin first.';
    return;
  }
  if (!victim) {
    if (err) err.textContent = 'Select who was eliminated.';
    return;
  }
  if (hunter.id === victim.id) {
    if (err) err.textContent = 'Choose two different players.';
    return;
  }
  if (state.phase !== 'playing') {
    if (err) err.textContent = 'The round is not running.';
    return;
  }
  if (hunter.status !== 'alive' || victim.status !== 'alive') {
    if (err) err.textContent = 'Both players must still be in the game.';
    return;
  }

  const pinField = $('#elimPin', form);
  const pin = pinField ? pinField.value.trim() : '';
  if (err) err.textContent = '';
  const button = formButton(form);

  await runBusy(button, 'Confirming…', async () => {
    const result = await checkPin(hunter, pin);
    if (!result.ok) {
      if (err) err.textContent = result.err;
      if (pinField) {
        pinField.value = '';
        pinField.focus();
      }
      return;
    }

    const H = result.player;
    const V = byId(victim.id);
    if (!V || V.status !== 'alive' || H.status !== 'alive' || H.target !== V.id) {
      if (err) {
        err.textContent = `${H.name} is not currently hunting ${V ? V.name : 'that player'}. Check the names.`;
      }
      if (pinField) pinField.value = '';
      return;
    }

    const change = await applyChange((s) => {
      const a = s.players.find((p) => p.id === H.id);
      const b = s.players.find((p) => p.id === V.id);
      if (!a || !b || a.status !== 'alive' || b.status !== 'alive' || a.target !== b.id) return false;
      a.target = b.target;
      a.kills = (a.kills || 0) + 1;
      b.status = 'out';
      b.target = -1;
      pushLog(s, `${a.name} eliminated ${b.name}`, 'kill');
      if (alivePlayers(s).length <= 1) finishRound(s, 'last');
      return true;
    }, { undoLabel: `${H.name} eliminated ${V.name}` });

    if (!change.ok) {
      if (err) err.textContent = change.error || 'That elimination could not be saved. Refresh and check the status.';
      return;
    }

    if (pinField) pinField.value = '';
    if (err) err.textContent = '';
    const left = alivePlayers().length;
    if (button) button.dataset.lock = '1';

    startSecret(`
      <div class="secret-kicker">Elimination confirmed</div>
      <div class="secret-name">${esc(V.name)}</div>
      <p class="secret-sub">${left <= 1 ? 'You are the last one standing.' : 'You now inherit their target.'}</p>`,
    6, () => {
      if (button && button.isConnected) {
        delete button.dataset.lock;
        button.disabled = false;
      }
      ui.selVictim = '';
      ui.tab = 'status';
      ui.focusView = true;
      render();
    });
  });
}

/* =========================================================
   21. Delegated events
   ========================================================= */
function enterPlayer() {
  ui.stage = 'app';
  ui.role = 'player';
  if (ui.me && !byId(ui.me)) {
    ui.me = null;
    clearSession();
  }
  if (ui.me) saveSession();
  ui.tab = defaultPlayerTab();
  ui.focusView = true;
  render();
}

function togglePin(act) {
  const input = document.getElementById(act.dataset.target || '');
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  act.textContent = show ? 'Hide' : 'Show';
  act.setAttribute('aria-pressed', show ? 'true' : 'false');
  input.focus();
  if (show) {
    const end = input.value.length;
    try { input.setSelectionRange(end, end); } catch { /* ignore */ }
  }
}

function onViewClick(event) {
  const go = event.target.closest('[data-go]');
  if (go) {
    const dest = go.dataset.go;
    if (dest === 'host') {
      ui.stage = 'hostkey';
      ui.role = null;
      ui.tab = null;
      ui.focusSel = '#hostKey';
      render();
    } else if (dest === 'player') {
      enterPlayer();
    } else if (dest === 'continue') {
      enterPlayer();
    } else if (dest === 'landing') {
      ui.stage = 'landing';
      ui.role = null;
      ui.tab = null;
      render();
    }
    return;
  }

  const act = event.target.closest('[data-act]');
  if (!act) return;
  const id = Number(act.dataset.id);

  switch (act.dataset.act) {
    case 'toggle-pin': togglePin(act); break;
    case 'hide-secret': endSecret(); break;
    case 'generate': void startRound(false); break;
    case 'newround': void startRound(true); break;
    case 'endround': void endRound(); break;
    case 'backsetup': void backToSetup(); break;
    case 'clear': void clearPool(); break;
    case 'export': exportBackup(); break;
    case 'undo': void handleUndo(); break;
    case 'unlockall': void clearLockouts(); break;
    case 'reset': void resetGame(); break;
    case 'rename': void renamePlayer(byId(id)); break;
    case 'resetpin': void resetPlayerPin(byId(id)); break;
    case 'remove': void removePlayer(byId(id)); break;
    case 'join': void addToGame(byId(id)); break;
    case 'exit': logout(); break;
    case 'reload': window.location.reload(); break;
    case 'goto': selectTab(act.dataset.tab || ''); break;
    default: break;
  }
}

function onNavClick(event) {
  if (event.target.closest('[data-act="exit"]')) {
    logout();
    return;
  }
  const tab = event.target.closest('[data-tab]');
  if (tab) selectTab(tab.dataset.tab);
}

function onSubmit(event) {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  if (ui.busy) return;
  markActive();

  switch (form.dataset.form) {
    case 'hostkey':
      void handleHostKey(form);
      break;
    case 'add': {
      const input = $('#nameIn', form);
      const value = input ? input.value : '';
      if (input && value.trim()) input.value = '';
      void addPlayers([value]);
      break;
    }
    case 'bulk': {
      const area = $('#bulkNames', form);
      const names = area ? area.value.split(/\r?\n/) : [];
      const before = state.players.length;
      void addPlayers(names).then(() => {
        if (area && state.players.length > before) area.value = '';
      });
      break;
    }
    case 'join':
      void handleJoin(form);
      break;
    case 'reveal':
      void handleReveal(form);
      break;
    case 'elim':
      void handleElim(form);
      break;
    case 'roundclock':
      void saveRoundStart(form);
      break;
    default:
      break;
  }
}

function onChange(event) {
  const target = event.target;
  const form = target.closest('form');
  const err = form ? form.querySelector('.err') : null;
  if (err) err.textContent = '';

  if (target.id === 'joinWho') {
    ui.selJoin = target.value;
    refreshJoinFields();
    return;
  }
  if (target.id === 'revealWho') {
    ui.selReveal = target.value;
    return;
  }
  if (target.id === 'elimHunter') {
    ui.selHunter = target.value;
    const select = $('#elimVictim');
    if (select) {
      const keep = select.value;
      const options = alivePlayers().filter((p) => p.id !== Number(target.value));
      ui.selVictim = options.some((p) => String(p.id) === keep) ? keep : '';
      select.innerHTML = victimOptions(target.value);
    }
    return;
  }
  if (target.id === 'elimVictim') {
    ui.selVictim = target.value;
    return;
  }
  if (target.id === 'importFile') {
    const file = target.files && target.files[0];
    target.value = '';
    if (file) void importBackup(file);
  }
}

function onInput(event) {
  const target = event.target;
  if (!(target instanceof HTMLInputElement)) return;

  if (target.hasAttribute('data-pin')) {
    const digits = target.value.replace(/\D+/g, '').slice(0, MAX_PIN);
    if (digits !== target.value) target.value = digits;
  } else if (target.hasAttribute('data-code')) {
    const raw = target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    const formatted = raw.length > 4 ? `${raw.slice(0, 4)}-${raw.slice(4)}` : raw;
    if (formatted !== target.value) target.value = formatted;
  } else if (target.hasAttribute('data-round-start')) {
    const wrap = target.closest('.field');
    const preview = wrap ? wrap.querySelector('[data-round-end-preview]') : null;
    const ts = new Date(target.value).getTime();
    if (preview) preview.textContent = Number.isFinite(ts) ? fmtDateTime(ts + ROUND_MS) : 'invalid date';
  }

  const form = target.closest('form');
  const err = form ? form.querySelector('.err') : null;
  if (err) err.textContent = '';
}

function onGlobalKey(event) {
  if (event.key !== 'Escape' || modalOpen()) return;
  if (secret.timer) {
    event.preventDefault();
    endSecret();
  }
}

/* =========================================================
   22. Sync, idle lock and lifecycle
   ========================================================= */
function markActive() {
  if (isHost() && ui.stage === 'app') {
    ui.lastActive = Date.now();
    ui.idleWarned = false;
  }
}

function idleTick() {
  if (!isHost() || ui.stage !== 'app') return;
  const idle = Date.now() - (ui.lastActive || Date.now());
  if (idle >= HOST_IDLE_MS) {
    logout(`Host console locked after ${Math.round(HOST_IDLE_MS / 60000)} minutes of inactivity.`);
    return;
  }
  const left = HOST_IDLE_MS - idle;
  if (left <= HOST_WARN_MS && !ui.idleWarned) {
    ui.idleWarned = true;
    toast(`Host console locks in ${fmtSecs(Math.ceil(left / 1000))} unless you continue.`, 'warn', 7000);
  }
}

function roundClockTick() {
  if (ui.stage !== 'app' || !state.startedAt) return;
  const ends = state.startedAt + ROUND_MS;
  const left = ends - Date.now();
  const text = roundClockText(state);
  const fraction = state.phase === 'over' ? 0 : Math.max(0, Math.min(1, left / ROUND_MS));
  for (const el of $$('[data-round-countdown]')) {
    if (el.textContent !== text) el.textContent = text;
  }
  for (const bar of $$('[data-round-bar]')) {
    bar.style.transform = `scaleX(${fraction})`;
  }
}

function hostKeyTick() {
  if (ui.stage !== 'hostkey') return;
  const err = $('#hostErr');
  if (!err) return;
  const left = guard('host');
  const button = $('#view form[data-form="hostkey"] button[type="submit"]');
  if (button && !ui.busy) button.disabled = !!left;
  if (left) {
    err.textContent = `Locked. Try again in ${fmtSecs(left)}.`;
  } else if (err.textContent.startsWith('Locked.')) {
    err.textContent = '';
  }
}

function announceSync() {
  ui.pendingSync = false;
  if (ui.stage === 'app') toast('Game updated on another device.', 'info', 3200);
  render();
}

function flushPendingSync() {
  if (!ui.pendingSync) return;
  if (modalOpen() || secret.timer || ui.busy) return;
  announceSync();
}

function onVisibility() {
  if (document.visibilityState !== 'visible') return;
  if (!isHost() || ui.stage !== 'app') return;
  if (Date.now() - (ui.lastActive || 0) >= HOST_IDLE_MS) {
    logout('Host console locked after inactivity.');
  }
}

/* =========================================================
   23. Boot
   ========================================================= */
function renderBootError(error) {
  const nav = $('#tabs');
  if (nav) nav.hidden = true;
  const view = $('#view');
  if (!view) return;
  const message = error && error.message ? error.message : String(error || 'Unknown error');
  view.innerHTML = `
    <section class="card">
      <h2>Connection required</h2>
      <p class="muted">This shared game needs Supabase. Fill in the two placeholders near the top of the file, run the SQL setup, then reload.</p>
      <div class="callout callout-danger">${esc(message)}</div>
      <div class="row" style="margin-top:14px">
        <button type="button" class="btn btn-primary" data-act="reload">Reload</button>
      </div>
    </section>`;
}

async function init() {
  const nav = $('#tabs');
  const view = $('#view');
  if (!nav || !view) return;

  nav.addEventListener('click', onNavClick);
  view.addEventListener('click', onViewClick);
  view.addEventListener('submit', onSubmit);
  view.addEventListener('change', onChange);
  view.addEventListener('input', onInput);
  document.addEventListener('keydown', onGlobalKey);
  document.addEventListener('keydown', markActive);
  document.addEventListener('pointerdown', markActive, { passive: true });
  document.addEventListener('visibilitychange', onVisibility);

  try {
    sb = createSupabaseClient();
    remoteReady = true;
    await bootstrapRemote();
  } catch (error) {
    console.error(error);
    renderBootError(error);
    return;
  }

  const sessionId = readSession();
  if (sessionId && byId(sessionId)) ui.me = sessionId;
  else if (sessionId) clearSession();

  if (importedLegacy) {
    importedLegacy = false;
    toast('Your saved game was imported from this device into Supabase.', 'ok', 6000);
  }

  subscribeRemote();
  const latest = await fetchRemoteState();
  if (latest && latest.rev > (state.rev || 0)) adoptRemote(latest, true);

  window.setInterval(() => {
    idleTick();
    hostKeyTick();
    roundClockTick();
    flushPendingSync();
  }, 1000);

  render();
}

void init();
})();






</script>
